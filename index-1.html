  :root{
    --parchment:#0A1420;
    --parchment-dark:#24344A;
    --ink:#0F1B2E;
    --ink-deep:#071019;
    --gold:#D4AF37;
    --gold-light:#E8CB6B;
    --maroon:#8C3B4A;
    --text:#F5EFE0;
    --muted:#8B93A6;
    --card:#0F1B2E;
    --correct:#7FDDB0;
    --wrong:#E88A8A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; min-height:100vh;}
  body{
    font-family:'MvEamaan','Noto Sans Thaana', sans-serif;
    background:
      radial-gradient(circle at 20% 10%, rgba(212,175,55,0.08), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(212,175,55,0.06), transparent 45%),
      var(--parchment);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .frame{
    width:100%;
    max-width:440px;
  }
  .seal{
    text-align:center;
    margin-bottom:18px;
    user-select:none;
  }
  .seal .ring{
    width:74px; height:74px;
    margin:0 auto 10px;
    border-radius:50%;
    border:2px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 35% 30%, #1F3350, var(--ink-deep) 75%);
    box-shadow:0 3px 12px rgba(212,175,55,0.15);
  }
  .seal .ring span{ color:var(--gold-light); font-size:28px; font-weight:700; }
  .seal h1{
    font-size:22px; margin:0; color:var(--text); font-weight:700; letter-spacing:0.2px;
    cursor:pointer;
  }
  .seal .sub{ font-size:13px; color:var(--muted); margin-top:4px; }

  .card{
    background:var(--card);
    border:1px solid var(--parchment-dark);
    border-radius:10px;
    padding:22px 20px;
    position:relative;
    box-shadow:0 6px 22px rgba(0,0,0,0.35);
  }
  .card::before{
    content:"";
    position:absolute; inset:6px;
    border:1px solid rgba(212,175,55,0.25);
    border-radius:6px;
    pointer-events:none;
  }
  .inner{ position:relative; }

  .day-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px;
  }
  .day-badge{
    background:var(--gold); color:var(--ink-deep);
    border-radius:20px; padding:5px 14px; font-size:13px; font-weight:700;
  }
  .day-dots{ display:flex; gap:5px; }
  .day-dots .dot{ width:7px; height:7px; border-radius:50%; background:var(--parchment-dark); }
  .day-dots .dot.done{ background:var(--gold-light); }
  .day-dots .dot.today{ background:var(--gold); }

function todayMidnight(){
  const d = new Date();
  d.setHours(0,0,0,0);
  return d.getTime();
}

function currentDay(){
  const diff = Math.floor((todayMidnight() - state.roundStart) / DAY_MS);
  return diff + 1;
}

function isValidEmail(e){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
}

// ---------- Firestore: shared state ----------
// Only the admin is allowed (by the Firestore rules) to create the
// starting quiz doc. Regular visitors just read whatever exists.
async function ensureStateDocAsAdmin(){
  try{
    const snap = await getDoc(STATE_REF);
    if(!snap.exists()){
      await setDoc(STATE_REF, {
        questions: defaultQuestions,
        roundStart: todayMidnight(),
        prize: ''
      });
    }
  }catch(e){
    console.error('ensureStateDocAsAdmin failed', e);
  }
}

function subscribeState(){
  onSnapshot(STATE_REF, (snap)=>{
    stateReady = true;
    if(snap.exists()){
      state = snap.data();
    } else {
      state = null;
    }
    maybeRender();
  }, (err)=>{
    console.error('state snapshot error', err);
    stateReady = true;
    state = null;
    maybeRender();
  });
}

// ---------- Firestore: participant ----------
async function loadOrCreateParticipant(user){
  try{
    const ref = doc(db, 'fathisQuiz_participants', user.uid);
    const snap = await getDoc(ref);
    if(snap.exists()){
      participant = snap.data();
    } else {
      const pendingName = window.localStorage.getItem('pendingName') || (user.email.split('@')[0]);
      participant = { name: pendingName, email: user.email, answers:{}, total:0 };
      await setDoc(ref, participant);
      window.localStorage.removeItem('pendingName');
    }
  }catch(e){
    console.error('loadOrCreateParticipant failed', e);
    participant = { name: user.email.split('@')[0], email: user.email, answers:{}, total:0, _loadError:true };
  }
}

async function saveParticipant(){
  if(!currentUser) return;
  await setDoc(doc(db, 'fathisQuiz_participants', currentUser.uid), participant, { merge:true });
}

async function fetchLeaderboard(){
  const q = query(PARTICIPANTS_COL, orderBy('total','desc'));
  const snap = await getDocs(q);
  return snap.docs.map(d => ({ id:d.id, name:d.data().name, total:d.data().total||0 }));
}

// ---------- Auth flow ----------

  let email = window.localStorage.getItem('emailForSignIn');
  if(!email){
    email = window.prompt('ފުރިހަމަ ކުރުމަށް އީމެއިލް ޖައްސަވާ:');
  }
  if(!email) return;
  try{
    await signInWithEmailLink(auth, email, window.location.href);
    window.localStorage.removeItem('emailForSignIn');
    window.history.replaceState({}, document.title, window.location.pathname);
  }catch(e){
    console.error(e);
    alert('ލިންކުން ވަނުން ކާމިޔާބެއް ނުވި. އަލުން މަސައްކަތްކުރައްވާ.');
  }
}

async function onRegister(){
  const isSignin = authMode === 'signin';
  const val = isSignin ? '' : document.getElementById('regInput').value.trim();
  const emailRaw = document.getElementById('regEmail').value.trim();
  const email = emailRaw.toLowerCase();
  const errBox = document.getElementById('regErr');
  const btn = document.getElementById('regBtn');
  errBox.style.display = 'none';

  if((!isSignin && !val) || !emailRaw){
    errBox.textContent = isSignin ? 'އީމެއިލް ދެއްވުން ލާޒިމް.' : 'ނަމާއި އީމެއިލް ދެއްވުން ލާޒިމް.';
    errBox.style.display = 'block';
    return;
  }
  if(!isValidEmail(email)){
    errBox.textContent = 'އީމެއިލް އެޑްރެސް ރަނގަޅަށް ޖައްސަވާ.';
    errBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'ފޮނުވަނީ...';

  try{
    // Note: no pre-send duplicate check here. Firebase Auth already ties
    // one email to exactly one account — if this email registered before,
    // signing in again just resumes that same account and progress rather
    // than creating a second one, so blocking a resend here would only
    // get in the way of a returning participant signing back in.
    await sendSignInLinkToEmail(auth, email, { url: ACTION_URL, handleCodeInApp: true });
    window.localStorage.setItem('pendingName', val);
    window.localStorage.setItem('emailForSignIn', email);
    render();
  }catch(e){
    console.error(e);
    errBox.textContent = 'ފޮނުވުމުގައި މައްސަލައެއް ދިމާވެއްޖެ: ' + (e.code || e.message || e);
    errBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = isSignin ? 'ސައިން އިން' : 'ބައިވެރިވުން';
  }
}

async function onSignOut(){
  await signOut(auth);
}

// ---------- Rendering ----------
function maybeRender(){
  if(stateReady && authReady) render();
}

async function render(){
  const app = document.getElementById('app');
  const authFoot = document.getElementById('authFoot');

  if(!stateReady || !authReady){
    app.innerHTML = `<div class="msg-box"><div class="icon">⏳</div><p>ތައްޔާރުވަނީ...</p></div>`;
    authFoot.innerHTML = '';
    return;
  }

  // pending email-link (sent but not yet clicked)
  const pendingEmail = window.localStorage.getItem('emailForSignIn');
  if(!currentUser && pendingEmail){
    app.innerHTML = renderCheckEmail(pendingEmail);
    document.getElementById('retryRegBtn').onclick = ()=>{
      window.localStorage.removeItem('emailForSignIn');
      window.localStorage.removeItem('pendingName');
      render();
    };
    authFoot.innerHTML = '';
    return;
  }

  if(!currentUser){
    app.innerHTML = renderRegister();
    document.getElementById('regBtn').onclick = onRegister;
    const regInputEl = document.getElementById('regInput');
    if(regInputEl) regInputEl.addEventListener('keydown', e=>{ if(e.key==='Enter') onRegister(); });
    document.getElementById('regEmail').addEventListener('keydown', e=>{ if(e.key==='Enter') onRegister(); });
    const toggleLink = document.getElementById('toggleModeLink');
    if(toggleLink) toggleLink.onclick = ()=>{
      authMode = authMode === 'signin' ? 'register' : 'signin';
      render();
    };
    authFoot.innerHTML = '';
    return;
  }

  authFoot.innerHTML = `<span style="font-size:12px;color:var(--muted);text-decoration:underline;cursor:pointer;" id="signOutBtn">ސައިން އައުޓް</span>`;
  document.getElementById('signOutBtn').onclick = onSignOut;

  if(!state){
    app.innerHTML = isAdmin
      ? `<div class="msg-box"><div class="icon">⏳</div><p>ކުއިޒް ތައްޔާރުކުރަނީ...</p></div>`
      : `<div class="msg-box"><div class="icon">🛠️</div><p>ކުއިޒް އަދި ތައްޔާރެއް ނުވޭ. އެޑްމިން ފުރަތަމަ ވަދެވަޑައިގަތުމުން ކުއިޒް ފެށޭނެ.</p></div>`;
    return;
  }

  if(isAdmin){
    app.innerHTML = renderAdminHome();
    document.getElementById('openAdminBtn').onclick = openAdminPanel;
    return;
  }

  const day = currentDay();
  const pendingDay = getPendingRevealDay(participant, day);
  if(pendingDay){
    app.innerHTML = renderReveal(pendingDay, participant.answers[pendingDay]);
    bindRevealContinue(pendingDay);
    return;
  }

  if(day > 7){
    app.innerHTML = await renderFinished();
    return;
  }

  const answeredToday = participant.answers[day];
  if(answeredToday){
    app.innerHTML = await renderAnsweredToday(day);
    return;
  }

  app.innerHTML = renderQuestion(day);
  bindOptionClicks(day);
}

function getPendingRevealDay(p, curDay){
  for(let d=1; d<=7; d++){
    const a = p.answers[d];
    if(a && !a.revealed && d < curDay) return d;
  }
  return null;
}

function dayDots(activeDay){
  let html = '<div class="day-dots">';
  for(let i=1;i<=7;i++){
    let cls = 'dot';
    if(i < activeDay) cls += ' done';
    else if(i === activeDay) cls += ' today';
    html += `<div class="${cls}"></div>`;
  }
  html += '</div>';
  return html;
}

function renderQuestion(day){
  const q = state.questions[day-1];
  let optsHtml = q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('');
  return `
    <div class="day-row">
      <span class="day-badge">${day} ވަނަ ދުވަސް</span>
      ${dayDots(day)}
    </div>
    <h2 class="qtitle">${q.q}</h2>
    ${optsHtml}
    <div id="qFeedback"></div>
  `;
}

function bindOptionClicks(day){
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = ()=>{
      if(selectedOption !== null) return;
      const idx = parseInt(btn.dataset.i);
      selectedOption = idx;
      document.querySelectorAll('.opt').forEach((b,i)=>{
        b.disabled = true;
        if(i === idx) b.classList.add('selected');
      });
      document.getElementById('qFeedback').innerHTML =
        `<button class="btn" id="submitBtn" style="margin-top:14px;">ޖަވާބު ފޮނުވުން</button>`;
      document.getElementById('submitBtn').onclick = async ()=>{
        const q = state.questions[day-1];
        const correct = idx === q.correct;
        participant.answers[day] = { idx, correct, revealed:false };
        selectedOption = null;
        await saveParticipant();
        render();
      };
    };
  });
}

function renderReveal(day, ans){
  const q = state.questions[day-1];
  let optsHtml = q.opts.map((o,i)=>{
    let cls = 'opt';
    if(i === q.correct) cls += ' correct';
    else if(i === ans.idx) cls += ' wrong';
    return `<button class="${cls}" disabled>${o}</button>`;
  }).join('');
  const verdict = ans.correct
    ? 'ތިޔަ ބޭފުޅާ ދެއްވި ޖަވާބު ޞައްޙަ! 🎉'
    : 'ތިޔަ ބޭފުޅާ ދެއްވި ޖަވާބު ޞައްޙައެއް ނޫން.';
  return `
    <div class="day-row">
      <span class="day-badge">${day} ވަނަ ދުވަހުގެ ޖަވާބު</span>
      ${dayDots(day)}
    </div>
    <h2 class="qtitle">${q.q}</h2>
    ${optsHtml}
    <div class="explain">${verdict}<br><br>${q.explain}</div>
    <button class="btn" id="revealContBtn" style="margin-top:14px;">ކުރިއަށް ދިއުން</button>
  `;
}

function bindRevealContinue(day){
  document.getElementById('revealContBtn').onclick = async ()=>{
    const ans = participant.answers[day];
    if(!ans.revealed){
      ans.revealed = true;
      if(ans.correct) participant.total = (participant.total||0) + 1;
      await saveParticipant();
    }
    render();
  };
}

async function renderAnsweredToday(day){
  const lb = await renderLeaderboardList();
  return `

async function renderFinished(){
  const arr = await fetchLeaderboard();
  let winnerBlock = '';
  if(arr.length > 0){
    const maxScore = Math.max(...arr.map(p=>p.total));
    const winners = arr.filter(p=>p.total === maxScore).map(p=>p.name);
    const namesHtml = winners.join('، ');
    const isDraw = winners.length > 1;
    winnerBlock = `
      <div class="winner-box">
        <div class="winner-crown">👑</div>
        <div class="winner-label">${isDraw ? 'ބައި ވަނަ ހޯދި ފަރާތްތައް' : 'ވަނަ ހޯދި ފަރާތް'}</div>
        <div class="winner-names">${namesHtml}</div>
        <div class="winner-score">${maxScore}/7 ޞައްޙަ ޖަވާބު</div>
        ${state.prize ? `<div class="winner-prize">🎁 ${state.prize}</div>` : ''}
      </div>
    `;
  }
  return `
    <div class="msg-box">
      <div class="icon">🏆</div>
      <p>7 ދުވަހުގެ މުބާރާތް ނިމިއްޖެ!</p>
    </div>
    ${winnerBlock}
    ${renderLeaderboardHtml(arr)}
  `;
}

function renderLeaderboardHtml(arr){
  if(arr.length === 0){
    return `<div class="msg-box"><p>އަދި ބައިވެރިއެއް ނެތް.</p></div>`;
  }
  let html = '';
  arr.forEach((p,i)=>{
    const meCls = currentUser && p.id === currentUser.uid ? ' me' : '';
    html += `<div class="lb-row${meCls}"><span class="lb-rank">${i+1}</span><span class="lb-name">${p.name}</span><span class="lb-score">${p.total}/7</span></div>`;
  });
  return html;
}

async function renderLeaderboardList(){
  const arr = await fetchLeaderboard();
  return renderLeaderboardHtml(arr);
}

async function renderAdminBody(){
  const body = document.getElementById('adminBody');
  if(currentAdminTab === 'questions'){
    let html = '';
    state.questions.forEach((q, di)=>{
      html += `<div class="admin-q" data-day="${di}">
        <label>${di+1} ވަނަ ދުވަހުގެ ސުވާލު</label>
        <input type="text" class="q-text" value="${q.q.replace(/"/g,'&quot;')}">
        ${q.opts.map((o,oi)=>`
          <div class="opt-row">
            <input type="radio" name="correct-${di}" value="${oi}" ${q.correct===oi?'checked':''}>
            <input type="text" class="opt-text" data-oi="${oi}" value="${o.replace(/"/g,'&quot;')}">
          </div>
        `).join('')}
        <label>ތަފްޞީލު</label>
        <input type="text" class="q-explain" value="${(q.explain||'').replace(/"/g,'&quot;')}">
      </div>`;
    });
    html += `<button class="btn gold" id="saveQs">ސުވާލުތައް ސޭވްކުރުން</button>`;
    body.innerHTML = html;
    document.getElementById('saveQs').onclick = async ()=>{
      const newQuestions = JSON.parse(JSON.stringify(state.questions));
      document.querySelectorAll('.admin-q').forEach(el=>{
        const di = parseInt(el.dataset.day);
        newQuestions[di].q = el.querySelector('.q-text').value;
        newQuestions[di].explain = el.querySelector('.q-explain').value;
        const opts = [];
        el.querySelectorAll('.opt-text').forEach(inp=> opts.push(inp.value));
        newQuestions[di].opts = opts;
        const checked = el.querySelector('input[type=radio]:checked');
        newQuestions[di].correct = checked ? parseInt(checked.value) : 0;
      });
      await updateDoc(STATE_REF, { questions: newQuestions });
      alert('ސޭވްކުރެވިއްޖެ.');
    };
  } else if(currentAdminTab === 'participants'){
    const snap = await getDocs(query(PARTICIPANTS_COL, orderBy('total','desc')));
    const arr = snap.docs.map(d=>({ id:d.id, name:d.data().name, email:d.data().email||'', total:d.data().total||0 }));
    let html = '<div class="partlist">';
    if(arr.length === 0) html += '<p class="small-note">އަދި ބައިވެރިއެއް ނެތް.</p>';
    arr.forEach(p=>{
      html += `<div class="part-row"><span>${p.name} — ${p.total}/7${p.email ? `<br><span style="font-size:11px;color:var(--muted);">${p.email}</span>` : ''}</span><button class="del-btn" data-id="${p.id}">ނައްތާލުން</button></div>`;
    });
    html += '</div>';
    body.innerHTML = html;
    body.querySelectorAll('.del-btn').forEach(b=>{
      b.onclick = async ()=>{
        if(confirm('މި ބައިވެރިޔާ ނައްތާލަންތޯ؟')){
          await deleteDoc(doc(db, 'fathisQuiz_participants', b.dataset.id));
          renderAdminBody();
        }
      };
    });
  } else if(currentAdminTab === 'round'){
    const day = currentDay();
    body.innerHTML = `
      <p class="small-note">މިހާރު ކުރިއަށްދަނީ ${Math.min(day,7)} ވަނަ ދުވަސް (7 ދުވަހުގެ ތެރެއިން).</p>
      <label style="font-size:12px;color:var(--muted);display:block;margin:12px 0 4px;">ވަނަވަނަ ހޯދާ ފަރާތަށް ދޭ އިނާމު (ނިމުމުން ދައްކާނެ)</label>
      <input type="text" id="prizeInput" placeholder="މިސާލު: 500 ރުފިޔާގެ ފޮތު ވައުޗަރ" value="${(state.prize||'').replace(/"/g,'&quot;')}">
      <button class="btn gold" id="savePrize" style="margin-bottom:16px;">އިނާމު ސޭވްކުރުން</button>
      <p class="small-note">މުބާރާތް އަލުން ފެށުމުން ހުރިހާ ބައިވެރިންގެ ނަތީޖާ ފޮހެވި، 1 ވަނަ ދުވަހުން ފެށިގެން ދޭނެ.</p>
      <button class="btn maroon" id="resetRound">އައު މުބާރާތެއް ފެށުން</button>
    `;
    document.getElementById('savePrize').onclick = async ()=>{
      await updateDoc(STATE_REF, { prize: document.getElementById('prizeInput').value.trim() });
      alert('އިނާމު ސޭވްކުރެވިއްޖެ.');
    };
    document.getElementById('resetRound').onclick = async ()=>{
      if(confirm('އައު 7 ދުވަހުގެ މުބާރާތެއް ފަށަންތޯ؟ މިހާރުގެ ހުރިހާ ނަތީޖާއެއް ފޮހެވޭނެ.')){
        const snap = await getDocs(PARTICIPANTS_COL);
        const batch = writeBatch(db);
        snap.docs.forEach(d => batch.delete(d.ref));
        await batch.commit();
        await updateDoc(STATE_REF, { roundStart: todayMidnight() });
        closeModal();
        render();
      }
    };
  }
}

// ---------- init ----------
(async function init(){
  subscribeState();

  if(isSignInWithEmailLink(auth, window.location.href)){
    await completeEmailLinkSignIn();
  }

  onAuthStateChanged(auth, async (user)=>{
    currentUser = user;
    if(user){
      // Belt-and-suspenders: if we're genuinely signed in, any leftover
      // "waiting for verification" flag from an earlier/different browser
      // context is stale and must not keep blocking this session.
      window.localStorage.removeItem('emailForSignIn');
      if(user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()){
        isAdmin = true;
        participant = null;
        await ensureStateDocAsAdmin();
      } else {
        isAdmin = false;
        await loadOrCreateParticipant(user);
      }
    } else {
      isAdmin = false;
      participant = null;
    }
    authReady = true;
    maybeRender();
  });
})();
</script>
